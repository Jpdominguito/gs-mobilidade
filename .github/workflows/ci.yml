name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Validar contrato OpenAPI
        run: openapi-spec-validator contract/openapi.yaml
      - name: Testes com cobertura mínima de 70%
        run: pytest -v --cov=src --cov-report=term-missing --cov-fail-under=70
